<script type="text/plain" id="serverpy">
import asyncio, json, uuid
import websockets

PORT = 7767
ROOMS = {}
RID = [1]
CLIENTS = {}

def room_view(r):
    return {'id': r['id'], 'name': r['name'], 'map': r['map'], 'mode': r['mode'],
            'host': r['host'], 'started': r['started'],
            'players': {tk: {'name': p['name'], 'hero': p['hero'], 'team': p['team'], 'ready': p['ready']}
                        for tk, p in r['players'].items()}}

async def send(ws, obj):
    try:
        await ws.send(json.dumps(obj))
    except Exception:
        pass

async def broadcast(r, obj, skip=None):
    data = json.dumps(obj)
    for ws, c in list(CLIENTS.items()):
        if c.get('room') is r and ws is not skip:
            try:
                await ws.send(data)
            except Exception:
                pass

def make_player(c):
    return {'name': c.get('name', 'Guerrero'), 'hero': 0, 'team': 0, 'ready': False}

async def leave_room(ws, c):
    r = c.get('room')
    if not r:
        return
    c['room'] = None
    r['players'].pop(c['token'], None)
    if not r['players']:
        ROOMS.pop(r['id'], None)
        return
    if r['host'] == c['token']:
        r['host'] = next(iter(r['players']))
    await broadcast(r, {'t': 'room', 'room': room_view(r)})

async def handler(ws):
    c = {'token': uuid.uuid4().hex[:10], 'name': 'Guerrero', 'room': None}
    CLIENTS[ws] = c
    try:
        async for raw in ws:
            try:
                m = json.loads(raw)
            except Exception:
                continue
            t = m.get('t')
            r = c['room']
            if t == 'hello':
                c['name'] = str(m.get('name', 'Guerrero'))[:14]
                await send(ws, {'t': 'welcome', 'token': c['token']})
            elif t == 'rooms':
                lst = []
                for x in ROOMS.values():
                    lst.append({'id': x['id'], 'name': x['name'], 'map': x['map'], 'mode': x['mode'],
                                'host': x['host'], 'started': x['started'],
                                'cnt': len(x['players']), 'cap': int(x['mode'][0]) * 2})
                await send(ws, {'t': 'rooms', 'rooms': lst})
            elif t == 'create':
                mode = m.get('mode', '1v1')
                if mode not in ('1v1', '2v2', '3v3'):
                    mode = '1v1'
                room = {'id': RID[0], 'name': str(m.get('name', 'Sala'))[:18] or 'Sala',
                        'map': int(m.get('map', 0)) % 8, 'mode': mode,
                        'host': c['token'], 'started': False,
                        'players': {c['token']: make_player(c)}}
                RID[0] += 1
                ROOMS[room['id']] = room
                c['room'] = room
                await send(ws, {'t': 'room', 'room': room_view(room)})
            elif t == 'join' and r is None:
                room = ROOMS.get(int(m.get('id', 0)))
                if not room or room['started']:
                    await send(ws, {'t': 'err', 'msg': 'No se pudo unir a esa sala'})
                    continue
                cap = int(room['mode'][0]) * 2
                if len(room['players']) >= cap:
                    await send(ws, {'t': 'err', 'msg': 'La sala esta llena'})
                    continue
                per = cap // 2
                t0 = sum(1 for p in room['players'].values() if p['team'] == 0)
                t1 = sum(1 for p in room['players'].values() if p['team'] == 1)
                pl = make_player(c)
                pl['team'] = 0 if t0 <= t1 else 1
                if pl['team'] == 0 and t0 >= per:
                    pl['team'] = 1
                if pl['team'] == 1 and t1 >= per:
                    pl['team'] = 0
                room['players'][c['token']] = pl
                c['room'] = room
                await broadcast(room, {'t': 'room', 'room': room_view(room)})
            elif t == 'leave':
                await leave_room(ws, c)
            elif r and t == 'sethero':
                p = r['players'].get(c['token'])
                if p:
                    p['hero'] = int(m.get('hero', 0)) % 30
                    await broadcast(r, {'t': 'room', 'room': room_view(r)})
            elif r and t == 'ready':
                p = r['players'].get(c['token'])
                if p:
                    p['ready'] = bool(m.get('r'))
                    await broadcast(r, {'t': 'room', 'room': room_view(r)})
            elif r and t == 'start':
                if c['token'] == r['host'] and len(r['players']) >= 2 and not r['started']:
                    r['started'] = True
                    teams = {tk: {'hero': p['hero'], 'team': p['team'], 'name': p['name']}
                             for tk, p in r['players'].items()}
                    await broadcast(r, {'t': 'start', 'map': r['map'], 'mode': r['mode'], 'teams': teams})
            elif r and t in ('state', 'cast', 'snap'):
                o = dict(m)
                o['token'] = c['token']
                await broadcast(r, o, skip=ws)
            elif r and t == 'ndmg':
                for w2, c2 in list(CLIENTS.items()):
                    if c2.get('room') is r and c2['token'] == r['host']:
                        await send(w2, {'t': 'ndmg', 'id': m.get('id'), 'amt': m.get('amt', 0)})
            elif r and t == 'dmg':
                for w2, c2 in list(CLIENTS.items()):
                    if c2.get('room') is r and c2['token'] == m.get('to'):
                        await send(w2, {'t': 'dmg', 'amt': m.get('amt', 0), 'from': c['token']})
    except Exception:
        pass
    finally:
        try:
            await leave_room(ws, c)
        except Exception:
            pass
        CLIENTS.pop(ws, None)

async def main():
    print('ARCANE CLASH server en ws://0.0.0.0:' + str(PORT))
    async with websockets.serve(handler, '0.0.0.0', PORT):
        await asyncio.Future()

if __name__ == '__main__':
    asyncio.run(main())
</script>

function ringFx(x,y,col,r){addP(x,y,0,0,0.45,col,r,3);}

 for(var k=0;k<5;k++){pts.push({x:xx,y:yy});xx+=rnd(-18,18);yy+=rnd(18,28);}
 LBOLT.push({pts:pts,life:0.24,ml:0.24,col:col});}}

 else if(style==='petals'){for(var i3=0;i3<n;i3++)addP(x,y,rnd(-110,110),rnd(-140,-30),rnd(0.6,1.1),i3%2?colA:colB,4.5,6);}

 else{burst(x,y,colA,Math.ceil(n*0.6),240,4,9);burst(x,y,colB,Math.ceil(n*0.4),180,3,8);ringFx(x,y,colA,50);}}

function mtsLayer(w,h,base,amp,col,seed,off){var rf=srand(seed);ctx.fillStyle=col;var pts=[];
 for(var x=-120;x<=w+260;x+=90)pts.push([x,base-rf()*amp]);
 var o=((off%180)+180)%180;
 ctx.beginPath();ctx.moveTo(-120,h);ctx.lineTo(-120,pts[0][1]);
 for(var i=0;i<pts.length;i++)ctx.lineTo(pts[i][0]-o,pts[i][1]);
 ctx.lineTo(w+260,h);ctx.closePath();ctx.fill();}

 ctx.save();var sx=w*0.78,sy=h*0.2;ctx.globalAlpha=0.92;ctx.fillStyle=M.sun;
 poly(sx,sy,mi===3?h*0.11:h*0.075,mi===3?9:8,0.3);ctx.fill();
 ctx.globalAlpha=0.16;poly(sx,sy,h*0.17,10,0.2);ctx.fill();ctx.restore();
 if(mi===2||mi===6){var rf=srand(77+mi);ctx.fillStyle='#e8ecff';for(var i=0;i<26;i++){ctx.globalAlpha=(0.3+0.5*Math.abs(Math.sin(t*2+i)))*0.8;ctx.fillRect(rf()*w,rf()*h*0.5,1.6,1.6);}ctx.globalAlpha=1;}
 if(mi===0||mi===1||mi===4||mi===7){ctx.fillStyle='rgba(255,255,255,0.5)';for(var c=0;c<3;c++){var cx=((c*280+t*12*(c%2?1:-1))%(w+300))-150,cy=h*0.14+c*h*0.07;
  P([cx-w*0.1,cy,cx-w*0.06,cy-h*0.03,cx,cy-h*0.045,cx+w*0.07,cy-h*0.03,cx+w*0.11,cy,cx+w*0.05,cy+h*0.015,cx-w*0.05,cy+h*0.015]);ctx.fill();}}
 mtsLayer(w,h,h*0.62,h*0.22,M.m2,mi*99+5,t*4+par*0.06);
 mtsLayer(w,h,h*0.70,h*0.30,M.m1,mi*57+11,t*9+par*0.12);}

 }else{

/* ================= ENTRADA ================= */
function hitTest(px,py){for(var i=HOT.length-1;i>=0;i--){var b=HOT[i];if(b.cb&&px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return b;}return null;}
cv.addEventListener('pointerdown',function(e){try{
 audio();
 var r2=cv.getBoundingClientRect(),px=e.clientX-r2.left,py=e.clientY-r2.top;
 var b=hitTest(px,py);
 if(b){b.cb(px,py);FLASH={x:px,y:py,t:0.25};return;}
 if(SCENE==='battle'&&battle&&!battle.over&&!battle.shop&&px<W*0.5&&!EDIT.on){JOY.on=true;JOY.id=e.pointerId;JOY.bx=px;JOY.by=py;JOY.x=px;JOY.y=py;}
}catch(e2){}},{passive:true});
cv.addEventListener('pointermove',function(e){try{
 if(JOY.on&&e.pointerId===JOY.id){JOY.x=e.clientX;JOY.y=e.clientY;
  var dx=(JOY.x-JOY.bx)/44,dy=(JOY.y-JOY.by)/44;var l=Math.hypot(dx,dy);
  if(l>1){dx/=l;dy/=l;}JOY.vx=Math.abs(dx)<0.15?0:dx;JOY.vy=Math.abs(dy)<0.15?0:dy;}
}catch(e2){}},{passive:true});
function joyEnd(e){if(JOY.on&&e.pointerId===JOY.id){JOY.on=false;JOY.vx=0;JOY.vy=0;}}
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);
addEventListener('contextmenu',function(e){e.preventDefault();});
addEventListener('keydown',function(e){try{
 audio();KEY[e.code]=true;
 if(EDIT.on){
  if(e.key==='Backspace'){editSet(editVal().slice(0,-1));e.preventDefault();}
  else if(e.key==='Enter')EDIT.on=false;
  else if(e.key==='Escape')EDIT.on=false;
  else if(e.key.length===1)editAdd(e.key);
  return;}
 if(SCENE==='battle'&&battle&&!battle.over){
  if(e.code==='Space'){e.preventDefault();if(localH)tryAttack(localH);}
  if(e.code==='KeyB'){battle.shop=!battle.shop;battle.invSel=-1;sfxClick();}
  var map={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4,KeyR:4};
  if(map[e.code]!==undefined&&localH)tryCast(localH,map[e.code]);
  if(e.code==='Escape'){if(battle.shop)battle.shop=false;else exitBattle();}
 }else if(e.code==='Escape'){
  if(HELP)HELP=false;
  else if(SCENE==='sel2')SCENE='sel1';
  else if(SCENE==='sel1')SCENE='menu';}
}catch(e2){}});
addEventListener('keyup',function(e){KEY[e.code]=false;});

/* ================= BUCLE ================= */
var lastT=performance.now(),booted=false;
function frame(now){try{
 dt=Math.min(0.05,(now-lastT)/1000)||0.016;lastT=now;GT+=dt;
 if(dt>0.045)SLOWF++;else SLOWF=Math.max(0,SLOWF-2);
 if(SLOWF>90){SLOWF=0;if(QN>0)QN--;}
 if(!booted){booted=true;var d=document.getElementById('dbg');if(d&&!ERRMSG)d.textContent='';}
 NET.errT-=dt;musicTick();
 HOT=[];
 if(H>W){drawRotate();requestAnimationFrame(frame);return;}
 if(SCENE==='intro')drawIntro();
 else if(SCENE==='menu')drawMenu();
 else if(SCENE==='sel1')drawSel1();
 else if(SCENE==='sel2')drawSel2();
 else if(SCENE==='vs')drawVS();
 else if(SCENE==='net')drawNet();
 else if(SCENE==='rooms'){NET.pollT-=dt;if(NET.pollT<=0&&NET.ok){NET.pollT=1.8;NET.poll();}drawRooms();}
 else if(SCENE==='lobby')drawLobby();
 else if(SCENE==='battle'){updBattle();drawBattle();}
 else SCENE='menu';
 if(FLASH){FLASH.t-=dt;ctx.save();ctx.globalAlpha=clamp(FLASH.t/0.25,0,1)*0.6;ctx.strokeStyle='#ffd76a';ctx.lineWidth=3;poly(FLASH.x,FLASH.y,(0.25-FLASH.t)*160+8,8,GT*2);ctx.stroke();ctx.restore();if(FLASH.t<=0)FLASH=null;}
}catch(e){ERRMSG=String(e);var d=document.getElementById('dbg');if(d)d.textContent='ERROR: '+ERRMSG;}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
